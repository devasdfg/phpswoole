name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE: docker.io/devasdf/phpswoole

jobs:
  build:
    strategy:
      matrix:
        version: [8.2, 8.3, 8.4, 8.5]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push base (${{ matrix.version }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.version }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}

      - name: Build and push node (${{ matrix.version }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.version }}/Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}-node

      - name: Build and push node-dev (${{ matrix.version }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.version }}/Dockerfile.node-dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}-node-dev

      - name: Build and push alpine (${{ matrix.version }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.version }}/Dockerfile-alpine
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}-alpine

      - name: Build and push node-alpine (${{ matrix.version }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.version }}/Dockerfile.node-alpine
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}-node-alpine
